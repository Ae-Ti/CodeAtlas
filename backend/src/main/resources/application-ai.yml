# AI 모델 설정 (오픈웨이트 모델 로컬 구동 — 운영규정 제9조 대응)
#
# 사전 준비:
#   1. Ollama 설치: https://ollama.com
#   2. 모델 다운로드
#        ollama pull qwen3:8b            # 설명 생성 / NL2SQL (chat)
#        ollama pull nomic-embed-text    # 임베딩 768차원 — Script-3_pgvector.sql의 vector(768)와 일치해야 함
#   3. ollama serve  → 기본 11434 포트
#
# ⚠️ nomic-embed-text는 A의 Python 파이프라인에서도 반드시 동일하게 써야 합니다.
#    (Ollama HTTP API: POST http://localhost:11434/api/embed, {"model":"nomic-embed-text","input":"..."})
#    임베딩 모델이 다르면 벡터 공간이 달라져서 <=> 유사도 계산 자체가 무의미해집니다.
#
# 메인 application.yml의 spring.config.import 로 로드됩니다.

spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # 모델이 없어도 기동은 되고, 실제 호출 시점에 실패하도록 둡니다.
        pull-model-strategy: never
      chat:
        options:
          model: qwen3:8b
          temperature: 0.3   # 설명 생성이라 과장된 답변 방지 위해 낮게 설정
      embedding:
        options:
          model: nomic-embed-text
